  var svg = document.getElementById('cv');
  var stage = document.getElementById('stage');
  world = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  svg.appendChild(world);

  function renderWorld() { render(); }

  svg.addEventListener('click', function (e) {
    if (svg._dragged) { svg._dragged = false; return; }
    var el = e.target;
    while (el && el !== world && !el.classList.contains('nd')) el = el.parentNode;
    if (!el || el === world) return;
    var n = flatNodes[+el.getAttribute('data-i')];
    if (!n) return;
    if (n.children) { n._children = n.children; n.children = null; }
    else if (n._children) { n.children = n._children; n._children = null; }
    render();
  });

  var panning = false, sx = 0, sy = 0, stx = 0, sty = 0;
  stage.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    panning = true; svg._dragged = false;
    sx = e.clientX; sy = e.clientY; stx = tx; sty = ty;
    stage.classList.add('drag');
  });
  window.addEventListener('pointermove', function (e) {
    if (!panning) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) + Math.abs(dy) > 4) svg._dragged = true;
    tx = stx + dx; ty = sty + dy;
    apply();
  });
  window.addEventListener('pointerup', function () {
    panning = false;
    stage.classList.remove('drag');
    setTimeout(function () { svg._dragged = false; }, 0);
  });

  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    var rect = stage.getBoundingClientRect();
    zoomAt(e.clientX - rect.left, e.clientY - rect.top, e.deltaY < 0 ? 1.15 : 1 / 1.15);
  }, { passive: false });

  var btns = document.querySelectorAll('#bar button[data-lv]');
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', function () {
      document.querySelectorAll('#bar button').forEach(function (b) { b.classList.remove('on'); });
      this.classList.add('on');
      setLevel(+this.getAttribute('data-lv'));
      render(); fit();
    });
  }
  document.getElementById('all').addEventListener('click', function () {
    document.querySelectorAll('#bar button').forEach(function (b) { b.classList.remove('on'); });
    this.classList.add('on');
    expandAll(); render(); fit();
  });
  document.getElementById('fit').addEventListener('click', fit);

  setLevel(3);
  render();
  fit();
})();
</script>
</body>
</html>
